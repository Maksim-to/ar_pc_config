<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR Router-on-a-Stick Топология</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        
        .instruction {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.95);
            color: white;
            padding: 15px;
            border-radius: 10px;
            z-index: 1000;
            max-width: 300px;
            border: 2px solid #00ff88;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            background: rgba(0,0,0,0.9);
            padding: 25px;
            border-radius: 15px;
            z-index: 1000;
            text-align: center;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 1000;
        }
        
        .control-btn {
            background: linear-gradient(45deg, #00ff88, #0099ff);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #00ff88;
            width: 0%;
            transition: width 0.3s;
        }
        
        .vlan-info {
            position: absolute;
            bottom: 80px;
            left: 10px;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 12px;
            border-radius: 8px;
            z-index: 1000;
            max-width: 280px;
            border: 2px solid #0099ff;
            display: none;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div>🌐 Загрузка Router-on-a-Stick...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div style="font-size: 14px; margin-top: 10px;" id="loadStatus">Инициализация VLAN топологии...</div>
    </div>
    
    <div class="instruction">
        <h3>🔄 Router-on-a-Stick</h3>
        <p>• Наведите камеру на маркер</p>
        <p>• VLAN 10 (синий) ↔ VLAN 20 (красный)</p>
        <div id="markerStatus" style="color: #ff4444; margin-top: 10px;">❌ Ожидание маркера...</div>
    </div>

    <div class="vlan-info" id="vlanInfo">
        <h4 style="margin: 0 0 8px 0; color: #00ff88; font-size: 14px;">🏷️ VLAN Маршрутизация</h4>
        <div id="vlanDetails" style="font-size: 11px; line-height: 1.3;">Информация о меж VLAN передаче</div>
    </div>

    <div class="controls" id="controls" style="display: none;">
        <button class="control-btn" onclick="startVlanTransmission()">▶️ Старт</button>
        <button class="control-btn" onclick="pauseTransmission()">⏸️ Пауза</button>
        <button class="control-btn" onclick="resetTransmission()">🔄 Сброс</button>
        <button class="control-btn" onclick="showVlanConfig()">⚙️ Конфиг</button>
    </div>

    <a-scene 
        embedded 
        arjs="
            sourceType: webcam;
            debugUIEnabled: false;
            detectionMode: mono_and_matrix;
            matrixCodeType: 3x3;
        "
        renderer="colorManagement: true; antialias: true;"
        vr-mode-ui="enabled: false"
        loading-screen="enabled:false">
        
        <!-- Маркер для сетевой визуализации -->
        <a-marker 
            type="pattern" 
            url="pc-marker.patt"
            smooth="true"
            smoothCount="5"
            smoothTolerance="0.01"
            emitevents="true"
            size="0.16"
            id="networkMarker">
            
            <!-- Сетевая топология Router-on-a-Stick (горизонтальная ориентация) -->
            <a-entity position="0 0.1 0" scale="0.5 0.5 0.5" rotation="0 0 0">
                
                <!-- Уровень 1: Компьютеры (слева) -->
                <!-- ПК1 (VLAN 10) -->
                <a-entity id="pc1" position="-0.8 0.1 0">
                    <a-entity 
                        geometry="primitive: box; width: 0.1; height: 0.06; depth: 0.03"
                        material="color: #0099ff; shader: standard"
                        class="clickable"
                        data-info="ПК1 - VLAN 10&#10;IP: 192.168.10.10/24&#10;MAC: AA:BB:CC:DD:EE:10&#10;Шлюз: 192.168.10.1">
                    </a-entity>
                    <a-entity 
                        text="value: ПК1; color: white; align: center; width: 0.6"
                        position="0 -0.06 0"
                        scale="0.15 0.15 0.15">
                    </a-entity>
                    <a-entity 
                        text="value: (VLAN10); color: #0099ff; align: center; width: 0.8"
                        position="0 -0.1 0"
                        scale="0.12 0.12 0.12">
                    </a-entity>
                </a-entity>
                
                <!-- ПК2 (VLAN 20) -->
                <a-entity id="pc2" position="-0.8 -0.2 0">
                    <a-entity 
                        geometry="primitive: box; width: 0.1; height: 0.06; depth: 0.03"
                        material="color: #ff4444; shader: standard"
                        class="clickable"
                        data-info="ПК2 - VLAN 20&#10;IP: 192.168.20.20/24&#10;MAC: AA:BB:CC:DD:EE:20&#10;Шлюз: 192.168.20.1">
                    </a-entity>
                    <a-entity 
                        text="value: ПК2; color: white; align: center; width: 0.6"
                        position="0 -0.06 0"
                        scale="0.15 0.15 0.15">
                    </a-entity>
                    <a-entity 
                        text="value: (VLAN20); color: #ff4444; align: center; width: 0.8"
                        position="0 -0.1 0"
                        scale="0.12 0.12 0.12">
                    </a-entity>
                </a-entity>
                
                <!-- Уровень 2: Коммутатор (по центру) -->
                <a-entity id="switch" position="-0.3 0 0">
                    <a-entity 
                        geometry="primitive: box; width: 0.2; height: 0.12; depth: 0.08"
                        material="color: #666; shader: standard; metalness: 0.3"
                        class="clickable"
                        data-info="Коммутатор L2&#10;Port1: VLAN 10 (Access)&#10;Port2: VLAN 20 (Access)&#10;Port3: VLAN 10,20 (Trunk)">
                    </a-entity>
                    <a-entity 
                        text="value: SWITCH; color: white; align: center; width: 1.0"
                        position="0 -0.1 0"
                        scale="0.2 0.2 0.2">
                    </a-entity>
                    
                    <!-- Порты коммутатора -->
                    <a-entity geometry="primitive: sphere; radius: 0.015; material: color: #00ff88" position="0.1 0.05 0.045"></a-entity>
                    <a-entity geometry="primitive: sphere; radius: 0.015; material: color: #00ff88" position="0.1 -0.02 0.045"></a-entity>
                    <a-entity geometry="primitive: sphere; radius: 0.015; material: color: #ffaa00" position="-0.1 0 0.045"></a-entity>
                </a-entity>
                
                <!-- Уровень 3: Роутер (справа) -->
                <a-entity id="router" position="0.3 0 0">
                    <a-entity 
                        geometry="primitive: cylinder; radius: 0.08; height: 0.08"
                        material="color: #ffaa00; shader: standard; metalness: 0.5"
                        class="clickable"
                        data-info="Маршрутизатор&#10;Gi0/0.10: 192.168.10.1/24&#10;Gi0/0.20: 192.168.20.1/24&#10;Router-on-a-Stick конфигурация">
                    </a-entity>
                    <a-entity 
                        text="value: ROUTER; color: white; align: center; width: 0.8"
                        position="0 -0.08 0"
                        scale="0.2 0.2 0.2">
                    </a-entity>
                    
                    <!-- Сабинтерфейсы -->
                    <a-entity geometry="primitive: box; width: 0.06; height: 0.02; depth: 0.015; material: color: #0099ff" position="-0.03 0.05 0.045"></a-entity>
                    <a-entity geometry="primitive: box; width: 0.06; height: 0.02; depth: 0.015; material: color: #ff4444" position="0.03 0.05 0.045"></a-entity>
                </a-entity>
                
                <!-- Сетевые соединения (горизонтальные) -->
                <!-- ПК1 -> Коммутатор (VLAN 10) -->
                <a-entity line="start: -0.65 0.1 0; end: -0.4 0.1 0; color: #0099ff" id="linePc1Switch"></a-entity>
                
                <!-- ПК2 -> Коммутатор (VLAN 20) -->
                <a-entity line="start: -0.65 -0.2 0; end: -0.4 -0.2 0; color: #ff4444" id="linePc2Switch"></a-entity>
                
                <!-- Коммутатор -> Роутер (Trunk) -->
                <a-entity line="start: -0.2 0 0; end: 0.2 0 0; color: #00ff88" id="lineSwitchRouter"></a-entity>
                
                <!-- Анимированные пакеты -->
                <a-entity id="packetContainer">
                    <!-- Пакеты будут создаваться динамически -->
                </a-entity>
                
                <!-- Легенда VLAN (сверху) -->
                <a-entity position="0 0.35 0">
                    <a-entity 
                        text="value: VLAN 10: 192.168.10.0/24; color: #0099ff; align: center; width: 2.5"
                        position="-0.4 0 0"
                        scale="0.12 0.12 0.12">
                    </a-entity>
                    <a-entity 
                        text="value: VLAN 20: 192.168.20.0/24; color: #ff4444; align: center; width: 2.5"
                        position="0.4 0 0"
                        scale="0.12 0.12 0.12">
                    </a-entity>
                </a-entity>
                
                <!-- Освещение -->
                <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
                <a-light type="directional" position="1 2 3" intensity="0.8" color="#ffffff"></a-light>
                <a-light type="point" position="0 1 2" intensity="0.4" color="#00ff88"></a-light>
                
            </a-entity>
            
        </a-marker>
        
        <a-entity camera></a-entity>
        
    </a-scene>

    <script>
        let isTransmissionActive = false;
        let currentPacket = null;
        let packetSequence = 0;
        let currentDirection = 'vlan10_to_vlan20';
        
        // Симуляция загрузки
        let loadProgress = 0;
        const loadInterval = setInterval(() => {
            loadProgress += Math.random() * 15;
            if (loadProgress >= 100) {
                loadProgress = 100;
                clearInterval(loadInterval);
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                }, 500);
            }
            document.getElementById('progressFill').style.width = loadProgress + '%';
            document.getElementById('loadStatus').textContent = `Загрузка: ${Math.round(loadProgress)}%`;
        }, 200);
        
        // Отслеживание маркера
        const marker = document.getElementById('networkMarker');
        const statusDiv = document.getElementById('markerStatus');
        const controlsDiv = document.getElementById('controls');
        
        marker.addEventListener('markerFound', () => {
            statusDiv.innerHTML = '✅ Топология активирована!';
            statusDiv.style.color = '#00ff00';
            controlsDiv.style.display = 'flex';
        });
        
        marker.addEventListener('markerLost', () => {
            statusDiv.innerHTML = '❌ Ожидание маркера...';
            statusDiv.style.color = '#ff4444';
            controlsDiv.style.display = 'none';
            stopTransmission();
        });
        
        // Функции управления передачей
        function startVlanTransmission() {
            if (!isTransmissionActive) {
                isTransmissionActive = true;
                createVlanPacket();
            }
        }
        
        function pauseTransmission() {
            isTransmissionActive = false;
            if (currentPacket) {
                currentPacket.removeAttribute('animation');
            }
        }
        
        function resetTransmission() {
            stopTransmission();
            packetSequence = 0;
            document.getElementById('vlanInfo').style.display = 'none';
        }
        
        function stopTransmission() {
            isTransmissionActive = false;
            const packetContainer = document.getElementById('packetContainer');
            packetContainer.innerHTML = '';
            currentPacket = null;
        }
        
        function createVlanPacket() {
            if (!isTransmissionActive) return;
            
            packetSequence++;
            const packetId = `packet_${packetSequence}`;
            const isVlan10to20 = currentDirection === 'vlan10_to_vlan20';
            
            // Определяем цвета и позиции в зависимости от направления
            const sourceColor = isVlan10to20 ? '#0099ff' : '#ff4444';
            const destColor = isVlan10to20 ? '#ff4444' : '#0099ff';
            const startPos = isVlan10to20 ? '-0.65 0.1 0' : '-0.65 -0.2 0';
            const endPos = isVlan10to20 ? '-0.65 -0.2 0' : '-0.65 0.1 0';
            
            // Создание пакета
            const packet = document.createElement('a-entity');
            packet.setAttribute('id', packetId);
            packet.setAttribute('geometry', 'primitive: box; width: 0.025; height: 0.025; depth: 0.015');
            packet.setAttribute('material', `color: ${sourceColor}; shader: standard`);
            packet.setAttribute('position', startPos);
            
            // Этап 1: От ПК к коммутатору (горизонтально вправо)
            const switchX = isVlan10to20 ? -0.4 : -0.4;
            const switchY = isVlan10to20 ? 0.1 : -0.2;
            
            packet.setAttribute('animation', {
                property: 'position',
                from: startPos,
                to: `${switchX} ${switchY} 0`,
                dur: 1500,
                startEvents: 'start'
            });
            
            document.getElementById('packetContainer').appendChild(packet);
            currentPacket = packet;
            
            // Обновление информации
            updateVlanInfo(
                isVlan10to20 ? '📤 ПК1 → SWITCH' : '📤 ПК2 → SWITCH',
                `Пакет #${packetSequence}<br>VLAN: ${isVlan10to20 ? '10' : '20'}<br>От: ${isVlan10to20 ? '192.168.10.10' : '192.168.20.20'}`
            );
            
            // Этап 2: Коммутатор -> Роутер (Trunk, горизонтально вправо)
            setTimeout(() => {
                if (!isTransmissionActive) return;
                packet.setAttribute('animation', {
                    property: 'position',
                    from: `${switchX} ${switchY} 0`,
                    to: '0.2 0 0',
                    dur: 1500
                });
                updateVlanInfo(
                    '🔄 SWITCH → ROUTER',
                    `Пакет #${packetSequence}<br>Trunk порт<br>VLAN Tag: ${isVlan10to20 ? '10' : '20'}`
                );
            }, 1500);
            
            // Этап 3: Роутер (меж VLAN маршрутизация)
            setTimeout(() => {
                if (!isTransmissionActive) return;
                packet.setAttribute('material', 'color: #00ff88');
                packet.setAttribute('animation', {
                    property: 'position',
                    from: '0.2 0 0',
                    to: '0.25 0 0',
                    dur: 800
                });
                updateVlanInfo(
                    '🏷️ Меж VLAN Маршрутизация',
                    `Пакет #${packetSequence}<br>Сабинтерфейс: Gi0/0.${isVlan10to20 ? '10' : '20'}<br>Смена VLAN Tag`
                );
            }, 3000);
            
            // Этап 4: Роутер -> Коммутатор (горизонтально влево)
            setTimeout(() => {
                if (!isTransmissionActive) return;
                packet.setAttribute('material', `color: ${destColor}`);
                packet.setAttribute('animation', {
                    property: 'position',
                    from: '0.25 0 0',
                    to: '-0.2 0 0',
                    dur: 1500
                });
                updateVlanInfo(
                    '🔄 ROUTER → SWITCH',
                    `Пакет #${packetSequence}<br>Новый VLAN: ${isVlan10to20 ? '20' : '10'}<br>Назначение: ${isVlan10to20 ? '192.168.20.20' : '192.168.10.10'}`
                );
            }, 3800);
            
            // Этап 5: Коммутатор -> Получатель (горизонтально влево)
            setTimeout(() => {
                if (!isTransmissionActive) return;
                const destSwitchX = -0.4;
                const destSwitchY = isVlan10to20 ? -0.2 : 0.1;
                
                packet.setAttribute('animation', {
                    property: 'position',
                    from: '-0.2 0 0',
                    to: `${destSwitchX} ${destSwitchY} 0`,
                    dur: 1500
                });
            }, 5300);
            
            // Этап 6: Доставка получателю
            setTimeout(() => {
                if (!isTransmissionActive) return;
                packet.setAttribute('animation', {
                    property: 'position',
                    from: `${destSwitchX} ${isVlan10to20 ? -0.2 : 0.1} 0`,
                    to: endPos,
                    dur: 1500
                });
                updateVlanInfo(
                    isVlan10to20 ? '📥 Доставка ПК2' : '📥 Доставка ПК1',
                    `Пакет #${packetSequence}<br>Успешно доставлен!<br>VLAN ${isVlan10to20 ? '20' : '10'}`
                );
            }, 6800);
            
            // Завершение и создание следующего пакета
            setTimeout(() => {
                if (!isTransmissionActive) return;
                packet.remove();
                // Меняем направление для следующего пакета
                currentDirection = currentDirection === 'vlan10_to_vlan20' ? 'vlan20_to_vlan10' : 'vlan10_to_vlan20';
                if (isTransmissionActive) {
                    setTimeout(() => createVlanPacket(), 1000);
                }
            }, 8300);
        }
        
        function updateVlanInfo(title, details) {
            const infoDiv = document.getElementById('vlanInfo');
            infoDiv.innerHTML = `<h4 style="margin: 0 0 8px 0; color: #00ff88; font-size: 14px;">${title}</h4><div style="font-size: 11px; line-height: 1.3;">${details}</div>`;
            infoDiv.style.display = 'block';
        }
        
        function showVlanConfig() {
            alert('⚙️ Router-on-a-Stick Конфигурация:\n\n' +
                  'SWITCH CONFIG:\n' +
                  'interface Gi0/1\n switchport mode access\n switchport access vlan 10\n' +
                  'interface Gi0/2\n switchport mode access\n switchport access vlan 20\n' +
                  'interface Gi0/3\n switchport mode trunk\n switchport trunk allowed vlan 10,20\n\n' +
                  'ROUTER CONFIG:\n' +
                  'interface Gi0/0.10\n encapsulation dot1Q 10\n ip address 192.168.10.1 255.255.255.0\n' +
                  'interface Gi0/0.20\n encapsulation dot1Q 20\n ip address 192.168.20.1 255.255.255.0');
        }
        
        // Обработка кликов по сетевым устройствам
        document.querySelector('a-scene').addEventListener('click', function(evt) {
            const clickedEl = evt.detail.intersection?.object.el;
            if (clickedEl && clickedEl.classList.contains('clickable')) {
                const info = clickedEl.getAttribute('data-info');
                if (info) {
                    const lines = info.split('&#10;');
                    let alertText = '';
                    lines.forEach(line => {
                        alertText += line + '\n';
                    });
                    alert('🔧 Сетевое устройство:\n\n' + alertText);
                }
            }
        });
    </script>
</body>
</html>
