<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR Визуализация сетевых пакетов</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        
        .instruction {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.95);
            color: white;
            padding: 15px;
            border-radius: 10px;
            z-index: 1000;
            max-width: 350px;
            border: 2px solid #00ff88;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            background: rgba(0,0,0,0.9);
            padding: 25px;
            border-radius: 15px;
            z-index: 1000;
            text-align: center;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        
        .control-btn {
            background: linear-gradient(45deg, #00ff88, #0099ff);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #00ff88;
            width: 0%;
            transition: width 0.3s;
        }
        
        .packet-info {
            position: absolute;
            top: 50%;
            right: 10px;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 15px;
            border-radius: 10px;
            z-index: 1000;
            max-width: 250px;
            border: 2px solid #0099ff;
            display: none;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div>🌐 Загрузка сетевой визуализации...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div style="font-size: 14px; margin-top: 10px;" id="loadStatus">Инициализация сетевых компонентов...</div>
    </div>
    
    <div class="instruction">
        <h3>🔄 AR Сетевая топология</h3>
        <p>• Наведите камеру на маркер</p>
        <p>• Наблюдайте передачу пакетов</p>
        <p>• Используйте кнопки управления</p>
        <div id="markerStatus" style="color: #ff4444; margin-top: 10px;">❌ Ожидание маркера...</div>
    </div>

    <div class="packet-info" id="packetInfo">
        <h4 style="margin: 0 0 10px 0; color: #00ff88;">📦 Пакет данных</h4>
        <div id="packetDetails">Информация о текущем пакете</div>
    </div>

    <div class="controls" id="controls" style="display: none;">
        <button class="control-btn" onclick="startTransmission()">▶️ Старт</button>
        <button class="control-btn" onclick="pauseTransmission()">⏸️ Пауза</button>
        <button class="control-btn" onclick="resetTransmission()">🔄 Сброс</button>
        <button class="control-btn" onclick="showProtocolInfo()">📊 Протоколы</button>
    </div>

    <a-scene 
        embedded 
        arjs="
            sourceType: webcam;
            debugUIEnabled: false;
            detectionMode: mono_and_matrix;
            matrixCodeType: 3x3;
        "
        renderer="colorManagement: true; antialias: true;"
        vr-mode-ui="enabled: false"
        loading-screen="enabled:false">
        
        <!-- Маркер для сетевой визуализации -->
        <a-marker 
            type="pattern" 
            url="pc-marker.patt"
            smooth="true"
            smoothCount="5"
            smoothTolerance="0.01"
            emitevents="true"
            size="0.16"
            id="networkMarker">
            
            <!-- Сетевая топология -->
            <a-entity position="0 0.3 0" scale="0.7 0.7 0.7" rotation="0 0 0">
                
                <!-- Компьютер 1 (отправитель) -->
                <a-entity id="pc1" position="-0.8 0.4 0">
                    <a-entity 
                        geometry="primitive: box; width: 0.15; height: 0.1; depth: 0.05"
                        material="color: #00ff88; shader: standard"
                        class="clickable"
                        data-info="ПК1 - Отправитель&#10;IP: 192.168.1.10&#10;MAC: AA:BB:CC:DD:EE:01">
                    </a-entity>
                    <a-entity 
                        text="value: ПК1; color: white; align: center; width: 0.5"
                        position="0 -0.08 0"
                        scale="0.3 0.3 0.3">
                    </a-entity>
                </a-entity>
                
                <!-- Коммутатор (Switch) -->
                <a-entity id="switch" position="0 0.4 0">
                    <a-entity 
                        geometry="primitive: box; width: 0.2; height: 0.12; depth: 0.08"
                        material="color: #0099ff; shader: standard"
                        class="clickable"
                        data-info="Коммутатор L2&#10;8 портов 1Gb/s&#10;MAC-таблица: динамическая">
                    </a-entity>
                    <a-entity 
                        text="value: SWITCH; color: white; align: center; width: 0.8"
                        position="0 -0.1 0"
                        scale="0.25 0.25 0.25">
                    </a-entity>
                </a-entity>
                
                <!-- Роутер -->
                <a-entity id="router" position="0.8 0.4 0">
                    <a-entity 
                        geometry="primitive: cylinder; radius: 0.1; height: 0.08"
                        material="color: #ff4444; shader: standard"
                        class="clickable"
                        data-info="Маршрутизатор&#10;WAN: 85.214.132.10&#10;LAN: 192.168.1.1&#10;NAT: включен">
                    </a-entity>
                    <a-entity 
                        text="value: ROUTER; color: white; align: center; width: 0.8"
                        position="0 -0.08 0"
                        scale="0.25 0.25 0.25">
                    </a-entity>
                </a-entity>
                
                <!-- Компьютер 2 (получатель) -->
                <a-entity id="pc2" position="1.6 0.4 0">
                    <a-entity 
                        geometry="primitive: box; width: 0.15; height: 0.1; depth: 0.05"
                        material="color: #ffaa00; shader: standard"
                        class="clickable"
                        data-info="ПК2 - Получатель&#10;IP: 192.168.1.20&#10;MAC: AA:BB:CC:DD:EE:02">
                    </a-entity>
                    <a-entity 
                        text="value: ПК2; color: white; align: center; width: 0.5"
                        position="0 -0.08 0"
                        scale="0.3 0.3 0.3">
                    </a-entity>
                </a-entity>
                
                <!-- Сетевые соединения -->
                <a-entity line="start: -0.65 0.4 0; end: -0.1 0.4 0; color: #00ff88" id="line1"></a-entity>
                <a-entity line="start: 0.1 0.4 0; end: 0.65 0.4 0; color: #00ff88" id="line2"></a-entity>
                <a-entity line="start: 0.95 0.4 0; end: 1.45 0.4 0; color: #00ff88" id="line3"></a-entity>
                
                <!-- Анимированные пакеты данных -->
                <a-entity id="packetContainer">
                    <!-- Пакет будет создаваться динамически -->
                </a-entity>
                
                <!-- Трассировка маршрута -->
                <a-entity 
                    text="value: ПК1 → SWITCH → ROUTER → SWITCH → ПК2; color: #ffffff; align: center; width: 6"
                    position="0 0.7 0"
                    scale="0.2 0.2 0.2">
                </a-entity>
                
                <!-- Информация о протоколах -->
                <a-entity 
                    text="value: Ethernet → IP → TCP → HTTP; color: #ffaa00; align: center; width: 4"
                    position="0 0.65 0"
                    scale="0.15 0.15 0.15">
                </a-entity>
                
                <!-- Освещение -->
                <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
                <a-light type="directional" position="0 5 3" intensity="0.8" color="#ffffff"></a-light>
                
            </a-entity>
            
        </a-marker>
        
        <a-entity camera></a-entity>
        
    </a-scene>

    <script>
        let isTransmissionActive = false;
        let currentPacket = null;
        let packetSequence = 0;
        
        // Симуляция загрузки
        let loadProgress = 0;
        const loadInterval = setInterval(() => {
            loadProgress += Math.random() * 15;
            if (loadProgress >= 100) {
                loadProgress = 100;
                clearInterval(loadInterval);
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                }, 500);
            }
            document.getElementById('progressFill').style.width = loadProgress + '%';
            document.getElementById('loadStatus').textContent = `Загрузка: ${Math.round(loadProgress)}%`;
        }, 200);
        
        // Отслеживание маркера
        const marker = document.getElementById('networkMarker');
        const statusDiv = document.getElementById('markerStatus');
        const controlsDiv = document.getElementById('controls');
        
        marker.addEventListener('markerFound', () => {
            statusDiv.innerHTML = '✅ Сетевая топология активирована!';
            statusDiv.style.color = '#00ff00';
            controlsDiv.style.display = 'flex';
        });
        
        marker.addEventListener('markerLost', () => {
            statusDiv.innerHTML = '❌ Ожидание маркера...';
            statusDiv.style.color = '#ff4444';
            controlsDiv.style.display = 'none';
            stopTransmission();
        });
        
        // Функции управления передачей
        function startTransmission() {
            if (!isTransmissionActive) {
                isTransmissionActive = true;
                createPacket();
            }
        }
        
        function pauseTransmission() {
            isTransmissionActive = false;
            if (currentPacket) {
                currentPacket.removeAttribute('animation');
            }
        }
        
        function resetTransmission() {
            stopTransmission();
            packetSequence = 0;
            document.getElementById('packetInfo').style.display = 'none';
        }
        
        function stopTransmission() {
            isTransmissionActive = false;
            const packetContainer = document.getElementById('packetContainer');
            packetContainer.innerHTML = '';
            currentPacket = null;
        }
        
        function createPacket() {
            if (!isTransmissionActive) return;
            
            packetSequence++;
            const packetId = `packet_${packetSequence}`;
            
            // Создание пакета
            const packet = document.createElement('a-entity');
            packet.setAttribute('id', packetId);
            packet.setAttribute('geometry', 'primitive: box; width: 0.04; height: 0.04; depth: 0.02');
            packet.setAttribute('material', 'color: #ff4444; shader: standard');
            packet.setAttribute('position', '-0.65 0.4 0');
            
            // Анимация движения пакета по маршруту
            packet.setAttribute('animation', {
                property: 'position',
                from: '-0.65 0.4 0',
                to: '-0.1 0.4 0',
                dur: 2000,
                startEvents: 'start'
            });
            
            document.getElementById('packetContainer').appendChild(packet);
            currentPacket = packet;
            
            // Обновление информации о пакете
            updatePacketInfo('📤 Отправка с ПК1', `Пакет #${packetSequence}<br>От: 192.168.1.10<br>К: 192.168.1.20<br>Протокол: Ethernet`);
            
            // Последовательная анимация через всю сеть
            setTimeout(() => {
                if (!isTransmissionActive) return;
                packet.setAttribute('animation', {
                    property: 'position',
                    from: '-0.1 0.4 0',
                    to: '0.65 0.4 0',
                    dur: 2000
                });
                updatePacketInfo('🔄 Маршрутизация', `Пакет #${packetSequence}<br>Через: 192.168.1.1<br>NAT преобразование<br>Протокол: IP`);
            }, 2000);
            
            setTimeout(() => {
                if (!isTransmissionActive) return;
                packet.setAttribute('animation', {
                    property: 'position',
                    from: '0.65 0.4 0',
                    to: '0.95 0.4 0',
                    dur: 1500
                });
                updatePacketInfo('📥 Доставка на ПК2', `Пакет #${packetSequence}<br>Получен: 192.168.1.20<br>Порт: 80 (HTTP)<br>Статус: Успешно`);
            }, 4000);
            
            setTimeout(() => {
                if (!isTransmissionActive) return;
                packet.remove();
                if (isTransmissionActive) {
                    setTimeout(() => createPacket(), 1000);
                }
            }, 5500);
        }
        
        function updatePacketInfo(title, details) {
            const infoDiv = document.getElementById('packetInfo');
            infoDiv.innerHTML = `<h4 style="margin: 0 0 10px 0; color: #00ff88;">${title}</h4><div>${details}</div>`;
            infoDiv.style.display = 'block';
        }
        
        function showProtocolInfo() {
            alert('📊 Сетевые протоколы:\n\n' +
                  '• Ethernet (L2) - кадровая передача\n' +
                  '• IP (L3) - маршрутизация\n' + 
                  '• TCP (L4) - надежная доставка\n' +
                  '• HTTP (L7) - прикладной уровень\n\n' +
                  'MTU: 1500 байт\nTTL: 64');
        }
        
        // Обработка кликов по сетевым устройствам
        document.querySelector('a-scene').addEventListener('click', function(evt) {
            const clickedEl = evt.detail.intersection?.object.el;
            if (clickedEl && clickedEl.classList.contains('clickable')) {
                const info = clickedEl.getAttribute('data-info');
                if (info) {
                    const lines = info.split('&#10;');
                    let alertText = '';
                    lines.forEach(line => {
                        alertText += line + '\n';
                    });
                    alert('🔧 Сетевое устройство:\n\n' + alertText);
                }
            }
        });
    </script>
</body>
</html>
