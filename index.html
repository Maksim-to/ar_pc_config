<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR Визитка - СтанМашСтуд</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        
        .instruction {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.95);
            color: white;
            padding: 15px;
            border-radius: 10px;
            z-index: 1000;
            max-width: 350px;
            border: 2px solid #2E86AB;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            background: rgba(0,0,0,0.9);
            padding: 25px;
            border-radius: 15px;
            z-index: 1000;
            text-align: center;
        }
        
        .ar-buttons {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        
        .ar-btn {
            background: linear-gradient(45deg, #2E86AB, #A23B72);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(46, 134, 171, 0.3);
            transition: all 0.3s ease;
        }
        
        .ar-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 134, 171, 0.4);
        }
        
        .ar-btn:active {
            transform: translateY(0);
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #2E86AB;
            width: 0%;
            transition: width 0.3s;
        }
        
        .hint {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(46, 134, 171, 0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            z-index: 1000;
            font-size: 12px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div>⚙️ Загрузка AR-визитки...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div style="font-size: 14px; margin-top: 10px;" id="loadStatus">Инициализация промышленной AR сцены...</div>
    </div>
    
    <div class="instruction">
        <h3>🏭 СтанМашСтуд</h3>
        <p>• Наведите камеру на маркер визитки</p>
        <p>• Изучите 3D модели оборудования</p>
        <p>• Используйте кнопки для связи</p>
        <div id="markerStatus" style="color: #ff4444; margin-top: 10px;">❌ Ожидание маркера визитки...</div>
    </div>

    <div class="hint" id="hint" style="display: none;">
        📱 Наведите на визитку
    </div>

    <div class="ar-buttons" id="arButtons" style="display: none;">
        <button class="ar-btn" onclick="callPhone()">📞 Позвонить</button>
        <button class="ar-btn" onclick="showPortfolio()">📊 Проекты</button>
        <button class="ar-btn" onclick="visitWebsite()">🌐 Сайт</button>
    </div>

    <a-scene 
        embedded 
        arjs="
            sourceType: webcam;
            debugUIEnabled: false;
            detectionMode: mono_and_matrix;
            matrixCodeType: 3x3;
        "
        renderer="colorManagement: true; antialias: true;"
        vr-mode-ui="enabled: false"
        loading-screen="enabled:false">
        
        <!-- Маркер для визитной карточки -->
        <a-marker 
            type="pattern" 
            url="pc-marker.patt"
            smooth="true"
            smoothCount="5"
            smoothTolerance="0.01"
            emitevents="true"
            size="0.16"
            id="cardMarker">
            
            <!-- Основная сцена станкостроения -->
            <a-entity position="0 0.3 0" scale="0.8 0.8 0.8" rotation="0 0 0">
                
                <!-- Вращающийся шпиндель станка -->
                <a-entity 
                    geometry="primitive: cylinder; radius: 0.08; height: 0.3"
                    material="color: #2E86AB; shader: standard; metalness: 0.8; roughness: 0.2"
                    position="0 0.4 0"
                    animation="property: rotation; to: 360 0 0; loop: true; dur: 3000"
                    class="clickable"
                    data-info="Шпиндель ЧПУ станка - скорость до 24,000 об/мин, точность позиционирования 0.001мм">
                </a-entity>
                
                <!-- Деталь на станке -->
                <a-entity 
                    geometry="primitive: box; width: 0.15; height: 0.05; depth: 0.1"
                    material="color: #F18F01; shader: standard"
                    position="0 0.25 0.1"
                    animation="property: position; to: 0.1 0.25 0.1; loop: true; dir: alternate; dur: 4000"
                    class="clickable"
                    data-info="Обрабатываемая деталь - алюминиевый сплав, допуск ±0.01мм">
                </a-entity>
                
                <!-- Режущий инструмент -->
                <a-entity 
                    geometry="primitive: cone; radiusBottom: 0.03; radiusTop: 0.01; height: 0.15"
                    material="color: #C73E1D; shader: standard; metalness: 0.9"
                    position="0.2 0.35 0"
                    animation="property: rotation; to: 0 180 0; loop: true; dir: alternate; dur: 5000"
                    class="clickable"
                    data-info="Фреза для чистовой обработки - твердый сплав, 4 зубья">
                </a-entity>
                
                <!-- Система ЧПУ -->
                <a-entity 
                    geometry="primitive: box; width: 0.2; height: 0.08; depth: 0.05"
                    material="color: #333; shader: standard"
                    position="-0.25 0.3 0"
                    class="clickable"
                    data-info="Система ЧПУ - 5-осевая обработка, поддержка G-кодов">
                </a-entity>
                
                <!-- Логотип компании -->
                <a-entity 
                    geometry="primitive: torus; radius: 0.1; radiusTubular: 0.02"
                    material="color: #A23B72; shader: standard"
                    position="0 0.6 0"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 8000"
                    class="clickable"
                    data-info="СтанМашСтуд - инновации в станкостроении с 2010 года">
                </a-entity>
                
                <!-- Текстовые элементы -->
                <a-entity 
                    text="value: СтанМашСтуд; color: #2E86AB; align: center; width: 2.5"
                    position="0 0.15 0"
                    scale="0.6 0.6 0.6">
                </a-entity>
                
                <a-entity 
                    text="value: Инжиниринг и производство; color: white; align: center; width: 3"
                    position="0 0.08 0"
                    scale="0.3 0.3 0.3">
                </a-entity>
                
                <a-entity 
                    text="value: ЧПУ станки • Автоматизация • Робототехника; color: #F18F01; align: center; width: 4"
                    position="0 0.02 0"
                    scale="0.25 0.25 0.25">
                </a-entity>
                
                <!-- Анимированные искры обработки -->
                <a-entity id="sparks">
                    <a-entity geometry="primitive: sphere; radius: 0.008" material="color: #FFEAA7" 
                             position="0.15 0.3 0.05" animation="property: position; to: 0.18 0.35 0.08; loop: true; dur: 300"></a-entity>
                    <a-entity geometry="primitive: sphere; radius: 0.006" material="color: #FFEAA7" 
                             position="0.12 0.28 0.06" animation="property: position; to: 0.14 0.33 0.09; loop: true; dur: 400"></a-entity>
                    <a-entity geometry="primitive: sphere; radius: 0.007" material="color: #FFEAA7" 
                             position="0.14 0.29 0.04" animation="property: position; to: 0.16 0.34 0.07; loop: true; dur: 350"></a-entity>
                </a-entity>
                
                <!-- Конвейерная лента -->
                <a-entity 
                    geometry="primitive: plane; width: 0.4; height: 0.05"
                    material="color: #666; side: double"
                    position="0 -0.1 0"
                    rotation="-90 0 0">
                </a-entity>
                
                <!-- Детали на конвейере -->
                <a-entity 
                    geometry="primitive: box; width: 0.06; height: 0.03; depth: 0.04"
                    material="color: #F18F01"
                    position="-0.15 -0.08 0"
                    animation="property: position; to: 0.15 -0.08 0; loop: true; dur: 6000">
                </a-entity>
                
                <!-- Освещение -->
                <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
                <a-light type="directional" position="2 5 3" intensity="0.8" color="#ffffff"></a-light>
                <a-light type="point" position="0 2 2" intensity="0.5" color="#2E86AB"></a-light>
                <a-light type="point" position="1 1 1" intensity="0.3" color="#F18F01"></a-light>
                
            </a-entity>
            
        </a-marker>
        
        <a-entity camera></a-entity>
        
    </a-scene>

    <script>
        // Симуляция загрузки
        let loadProgress = 0;
        const loadInterval = setInterval(() => {
            loadProgress += Math.random() * 15;
            if (loadProgress >= 100) {
                loadProgress = 100;
                clearInterval(loadInterval);
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('hint').style.display = 'block';
                }, 500);
            }
            document.getElementById('progressFill').style.width = loadProgress + '%';
            document.getElementById('loadStatus').textContent = `Загрузка: ${Math.round(loadProgress)}%`;
        }, 200);
        
        // Отслеживание маркера
        const marker = document.getElementById('cardMarker');
        const statusDiv = document.getElementById('markerStatus');
        const buttonsDiv = document.getElementById('arButtons');
        const hintDiv = document.getElementById('hint');
        
        marker.addEventListener('markerFound', () => {
            statusDiv.innerHTML = '✅ Визитка распознана!';
            statusDiv.style.color = '#00ff00';
            buttonsDiv.style.display = 'flex';
            hintDiv.style.display = 'none';
        });
        
        marker.addEventListener('markerLost', () => {
            statusDiv.innerHTML = '❌ Ожидание маркера визитки...';
            statusDiv.style.color = '#ff4444';
            buttonsDiv.style.display = 'none';
            hintDiv.style.display = 'block';
        });
        
        // Функции для кнопок
        function callPhone() {
            alert('📞 СтанМашСтуд\nТел: +7 (495) 123-45-67\nОтдел продаж: доб. 101\nТехподдержка: доб. 102');
        }
        
        function showPortfolio() {
            alert('🏭 Наши проекты:\n\n• ЧПУ станки 5-осевые\n• Роботизированные линии\n• Автоматизация цехов\n• Системы контроля качества\n• Производство оснастки');
        }
        
        function visitWebsite() {
            alert('🌐 Переход на сайт stanmashstud.ru\n\nКаталог оборудования →\nТехническая документация →\nОнлайн-запрос коммерческого предложения →');
        }
        
        // Обработка кликов по 3D объектам
        document.querySelector('a-scene').addEventListener('click', function(evt) {
            const clickedEl = evt.detail.intersection?.object.el;
            if (clickedEl && clickedEl.classList.contains('clickable')) {
                const info = clickedEl.getAttribute('data-info');
                if (info) {
                    alert('⚙️ ' + info);
                }
                
                // Анимация при клике
                const originalScale = clickedEl.getAttribute('scale') || {x:1, y:1, z:1};
                clickedEl.setAttribute('animation', {
                    property: 'scale',
                    to: `${originalScale.x * 1.3} ${originalScale.y * 1.3} ${originalScale.z * 1.3}`,
                    dur: 300,
                    easing: 'easeOutElastic'
                });
                
                setTimeout(() => {
                    clickedEl.setAttribute('animation', {
                        property: 'scale', 
                        to: `${originalScale.x} ${originalScale.y} ${originalScale.z}`,
                        dur: 500,
                        easing: 'easeOutElastic'
                    });
                }, 1000);
            }
        });
        
        // Авто-скрытие инструкций через 25 секунд
        setTimeout(() => {
            const instruction = document.querySelector('.instruction');
            instruction.style.opacity = '0.7';
            instruction.style.transition = 'opacity 3s';
        }, 25000);
    </script>
</body>
</html>
