<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR Визитная карточка - Все файлы в одной папке</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        
        .instruction {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.95);
            color: white;
            padding: 15px;
            border-radius: 10px;
            z-index: 1000;
            max-width: 350px;
            border: 2px solid #ff6b35;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            background: rgba(0,0,0,0.9);
            padding: 25px;
            border-radius: 15px;
            z-index: 1000;
            text-align: center;
        }
        
        .marker-image {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: white;
            padding: 12px;
            border-radius: 8px;
            max-width: 160px;
            z-index: 1000;
        }
        
        .marker-image img {
            max-width: 100%;
            height: auto;
            border: 2px solid #333;
        }
        
        .ar-buttons {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        
        .ar-btn {
            background: linear-gradient(45deg, #ff6b35, #ff8e53);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
            transition: all 0.3s ease;
        }
        
        .ar-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }
        
        .ar-btn:active {
            transform: translateY(0);
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #ff6b35;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div>🔄 Загрузка AR-визитки...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div style="font-size: 14px; margin-top: 10px;" id="loadStatus">Инициализация 3D контента...</div>
    </div>
    
    <div class="instruction">
        <h3>🚀 AR Визитная карточка</h3>
        <p>• Наведите камеру на маркер справа</p>
        <p>• Взаимодействуйте с 3D объектами</p>
        <p>• Используйте кнопки для действий</p>
        <div id="markerStatus" style="color: #ff4444; margin-top: 10px;">❌ Ожидание маркера...</div>
    </div>

    <div class="ar-buttons" id="arButtons" style="display: none;">
        <button class="ar-btn" onclick="callPhone()">📞 Позвонить</button>
        <button class="ar-btn" onclick="showPortfolio()">💼 Портфолио</button>
        <button class="ar-btn" onclick="visitWebsite()">🌐 Сайт</button>
    </div>

    <div class="marker-image">
        <p style="margin: 0 0 8px 0; font-weight: bold;">📱 AR Маркер:</p>
        <img src="card-marker.png" alt="AR Marker">
    </div>

    <a-scene 
        embedded 
        arjs="
            sourceType: webcam;
            debugUIEnabled: false;
            detectionMode: mono_and_matrix;
            matrixCodeType: 3x3;
        "
        renderer="colorManagement: true; antialias: true;"
        vr-mode-ui="enabled: false"
        loading-screen="enabled:false">
        
        <!-- Маркер для визитной карточки -->
        <a-marker 
            type="pattern" 
            url="card-marker.patt"
            smooth="true"
            smoothCount="5"
            smoothTolerance="0.01"
            emitevents="true"
            size="0.16"
            id="cardMarker">
            
            <!-- Основная сцена -->
            <a-entity position="0 0.3 0" scale="0.8 0.8 0.8" rotation="0 0 0">
                
                <!-- 3D Логотип (вращающаяся сфера) -->
                <a-entity 
                    geometry="primitive: sphere; radius: 0.15"
                    material="color: #ff6b35; shader: standard; metalness: 0.3; roughness: 0.2"
                    position="0 0.4 0"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"
                    class="clickable"
                    data-info="Логотип компании - инновационные решения в AR технологиях">
                </a-entity>
                
                <!-- Плавающие элементы портфолио -->
                <a-entity 
                    geometry="primitive: box; width: 0.1; height: 0.1; depth: 0.1"
                    material="color: #4ECDC4; shader: standard"
                    position="-0.3 0.3 0"
                    animation="property: position; to: -0.3 0.5 0; loop: true; dir: alternate; dur: 2000"
                    class="clickable"
                    data-info="Проект №1: Разработка AR приложений">
                </a-entity>
                
                <a-entity 
                    geometry="primitive: cylinder; radius: 0.08; height: 0.15"
                    material="color: #45B7D1; shader: standard"
                    position="0.25 0.25 0"
                    animation="property: rotation; to: 0 0 360; loop: true; dur: 8000"
                    class="clickable"
                    data-info="Проект №2: 3D визуализация и моделирование">
                </a-entity>
                
                <a-entity 
                    geometry="primitive: cone; radiusBottom: 0.1; radiusTop: 0; height: 0.2"
                    material="color: #96CEB4; shader: standard"
                    position="0.2 0.6 0"
                    animation="property: position; to: 0.4 0.6 0; loop: true; dir: alternate; dur: 3000"
                    class="clickable"
                    data-info="Проект №3: Веб-разработка и дизайн">
                </a-entity>
                
                <!-- Текстовые элементы -->
                <a-entity 
                    text="value: Иван Иванов; color: white; align: center; width: 1.5"
                    position="0 0.15 0"
                    scale="0.8 0.8 0.8">
                </a-entity>
                
                <a-entity 
                    text="value: AR/VR Разработчик; color: #ff6b35; align: center; width: 2"
                    position="0 0.05 0"
                    scale="0.5 0.5 0.5">
                </a-entity>
                
                <!-- Анимированные частицы -->
                <a-entity id="particles">
                    <a-entity geometry="primitive: sphere; radius: 0.02" material="color: #FFEAA7" 
                             position="0.1 0.7 0" animation="property: position; to: 0.3 0.9 0; loop: true; dur: 4000"></a-entity>
                    <a-entity geometry="primitive: sphere; radius: 0.02" material="color: #FFEAA7" 
                             position="-0.2 0.8 0" animation="property: position; to: -0.4 0.6 0; loop: true; dur: 3500"></a-entity>
                    <a-entity geometry="primitive: sphere; radius: 0.02" material="color: #FFEAA7" 
                             position="0.15 0.5 0" animation="property: position; to: -0.15 0.7 0; loop: true; dur: 4500"></a-entity>
                </a-entity>
                
                <!-- Освещение -->
                <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
                <a-light type="directional" position="2 5 3" intensity="0.8" color="#ffffff"></a-light>
                <a-light type="point" position="0 2 2" intensity="0.4" color="#ff6b35"></a-light>
                <a-light type="point" position="-2 1 1" intensity="0.3" color="#4ECDC4"></a-light>
                
            </a-entity>
            
        </a-marker>
        
        <a-entity camera></a-entity>
        
    </a-scene>

    <script>
        // Симуляция загрузки
        let loadProgress = 0;
        const loadInterval = setInterval(() => {
            loadProgress += Math.random() * 15;
            if (loadProgress >= 100) {
                loadProgress = 100;
                clearInterval(loadInterval);
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                }, 500);
            }
            document.getElementById('progressFill').style.width = loadProgress + '%';
            document.getElementById('loadStatus').textContent = `Загрузка: ${Math.round(loadProgress)}%`;
        }, 200);
        
        // Отслеживание маркера
        const marker = document.getElementById('cardMarker');
        const statusDiv = document.getElementById('markerStatus');
        const buttonsDiv = document.getElementById('arButtons');
        
        marker.addEventListener('markerFound', () => {
            statusDiv.innerHTML = '✅ Визитка активирована!';
            statusDiv.style.color = '#00ff00';
            buttonsDiv.style.display = 'flex';
        });
        
        marker.addEventListener('markerLost', () => {
            statusDiv.innerHTML = '❌ Ожидание маркера...';
            statusDiv.style.color = '#ff4444';
            buttonsDiv.style.display = 'none';
        });
        
        // Функции для кнопок
        function callPhone() {
            alert('📞 Имитация звонка: +7 (999) 123-45-67');
            // В реальном приложении: window.location.href = 'tel:+79991234567';
        }
        
        function showPortfolio() {
            alert('💼 Открытие портфолио...\n\n• AR Архитектура ПК\n• Виртуальные выставки\n• Интерактивные презентации\n• 3D Визуализация');
        }
        
        function visitWebsite() {
            alert('🌐 Переход на сайт portfolio.ru');
            // В реальном приложении: window.open('https://portfolio.ru', '_blank');
        }
        
        // Обработка кликов по 3D объектам
        document.querySelector('a-scene').addEventListener('click', function(evt) {
            const clickedEl = evt.detail.intersection?.object.el;
            if (clickedEl && clickedEl.classList.contains('clickable')) {
                const info = clickedEl.getAttribute('data-info');
                if (info) {
                    alert('💡 ' + info);
                }
                
                // Анимация при клике
                const originalScale = clickedEl.getAttribute('scale') || {x:1, y:1, z:1};
                clickedEl.setAttribute('animation', {
                    property: 'scale',
                    to: `${originalScale.x * 1.3} ${originalScale.y * 1.3} ${originalScale.z * 1.3}`,
                    dur: 300,
                    easing: 'easeOutElastic'
                });
                
                setTimeout(() => {
                    clickedEl.setAttribute('animation', {
                        property: 'scale', 
                        to: `${originalScale.x} ${originalScale.y} ${originalScale.z}`,
                        dur: 500,
                        easing: 'easeOutElastic'
                    });
                }, 1000);
            }
        });
        
        // Авто-скрытие инструкций через 20 секунд
        setTimeout(() => {
            const instruction = document.querySelector('.instruction');
            instruction.style.opacity = '0.7';
            instruction.style.transition = 'opacity 3s';
        }, 20000);
    </script>
</body>
</html>
